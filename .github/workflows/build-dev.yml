name: Build Dev APK

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      maa_repo:
        description: 'MAA Core GitHub repo (owner/repo)'
        required: false
        default: 'MaaAssistantArknights/MaaAssistantArknights'
      maa_tag:
        description: 'MAA Core release tag'
        required: false
        default: 'latest'
      maafw_tag:
        description: 'MaaFramework tag to override libMaaAndroidNativeControlUnit.so (empty = keep the one bundled by MAA)'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;29.0.13113456" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install OCR conversion deps
        run: python -m pip install -r scripts/requirements.txt

      - name: Download and deploy MAA Core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_ARG=""
          MAA_TAG="${{ github.event.inputs.maa_tag }}"
          if [ -n "$MAA_TAG" ] && [ "$MAA_TAG" != "latest" ]; then
            TAG_ARG="--tag $MAA_TAG"
          fi
          MAA_REPO="${{ github.event.inputs.maa_repo }}"
          REPO_ARG=""
          if [ -n "$MAA_REPO" ]; then
            REPO_ARG="--repo $MAA_REPO"
          fi
          MAAFW_ARG=""
          MAAFW_TAG="${{ github.event.inputs.maafw_tag }}"
          if [ -n "$MAAFW_TAG" ]; then
            MAAFW_ARG="--maafw-tag $MAAFW_TAG"
          fi
          python scripts/setup_maa_core.py --clean $TAG_ARG $REPO_ARG $MAAFW_ARG

      - name: Trim resource for Taobao shell (keep OCR models only)
        run: |
          RES=app/src/main/assets/MaaSync/MaaResource
          # 明日方舟专属大体量数据删除（保留小体量 json 骨架保证 MaaCore LoadResource 兼容）
          rm -rf $RES/copilot $RES/custom_infrast $RES/global                  $RES/Arknights-Tile-Pos $RES/roguelike $RES/battle
          # base tasks 换成淘宝任务 pipeline（MaaCore 读 tasks/tasks.json）
          rm -rf $RES/tasks
          mkdir -p $RES/tasks
          cp app/src/main/assets/overrides/resource/tasks/tasks.json $RES/tasks/tasks.json
          # 同步到 MaaCore 读取的另一个源位置
          cp app/src/main/assets/overrides/resource/tasks/tasks.json $RES/tasks.json
          ls -la $RES
          du -sh $RES

      - name: Print MAA Resource version
        run: cat app/src/main/assets/MaaSync/MaaResource/version.json

      - name: Print MaaFramework control unit version
        run: python scripts/print_maafw_version.py

      - name: Run Lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:lintDebug

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Build Debug APK
        env:
          # fork 的 PR 拿不到 secret，构建出来的包不带遥测
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
